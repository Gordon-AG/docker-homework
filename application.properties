# Подключение к PostgreSQL (меняем mysql на postgresql, указываем хост localhost и стандартный порт 5432)
spring.datasource.url=jdbc:postgresql://localhost:5432/mydb
spring.datasource.username=myuser
spring.datasource.password=mypassword

# Драйвер для PostgreSQL (обычно подтягивается автоматически, но так надежнее)
spring.datasource.driver-class-name=org.postgresql.Driver

# Порт, на котором будет работать само приложение (по заданию стандартный 9999, можете оставить или поменять)
server.port=9999